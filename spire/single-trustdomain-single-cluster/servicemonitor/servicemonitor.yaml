apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: "server"
    app.kubernetes.io/instance: "spire"
    app.kubernetes.io/component: "server"
  name: spire-server
  namespace: spire-mgmt
spec:
  endpoints:
  - interval: 30s
    port: metrics
    scheme: http
  selector:
    matchLabels:
      app.kubernetes.io/name: "server"
      app.kubernetes.io/instance: "spire"
      app.kubernetes.io/component: "server"
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: "agent"
    app.kubernetes.io/instance: "spire"
    app.kubernetes.io/component: "default"
  name: spire-agent
  namespace: spire-mgmt
spec:
  endpoints:
  - interval: 30s
    port: metrics
    scheme: http
  selector:
    matchLabels:
      app.kubernetes.io/name: "agent"
      app.kubernetes.io/instance: "spire"
      app.kubernetes.io/component: "default"
