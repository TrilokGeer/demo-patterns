apiVersion: v1
kind: Pod
metadata:
  name: spire-svid-test
  namespace: svid-test
  labels:
    app: spire-svid-test
    app.kubernetes.io/name: svid-test
    release: test
spec:
  restartPolicy: Never
  serviceAccountName: svid-test
  containers:
  - name: test
#    image: ghcr.io/spiffe/spire-agent:1.11.2
    image: alpine:3.19
    command: ["/bin/sh", "-c", "sleep 360000"]
    volumeMounts:
    - mountPath: /spiffe-workload-api
      name: spiffe-workload-api
      readOnly: true
      securityContext: 
        {}
  volumes:
  - name: spiffe-workload-api
    csi: 
      driver: "csi.spiffe.io"
      readOnly: true
