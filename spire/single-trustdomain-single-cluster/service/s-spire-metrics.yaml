apiVersion: v1
kind: Service
metadata:
  name: spire-server-metrics
  namespace: spire-mgmt
  labels:
    app: spire-server
    metrics: "true"
    app.kubernetes.io/name: "server"
    app.kubernetes.io/instance: "spire"
    app.kubernetes.io/component: "server"
spec:
  selector:
      app.kubernetes.io/name: "server"
      app.kubernetes.io/instance: "spire"
      app.kubernetes.io/component: "server"
  ports:
    - name: metrics
      port: 9402
      targetPort: 9402
---
apiVersion: v1
kind: Service
metadata:
  name: spire-agent-metrics
  namespace: spire-mgmt
  labels:
    app: spire-agent
    metrics: "true"
    app.kubernetes.io/name: "agent"
    app.kubernetes.io/instance: "spire"
    app.kubernetes.io/component: "default"
spec:
  selector:
      app.kubernetes.io/name: "agent"
      app.kubernetes.io/instance: "spire"
      app.kubernetes.io/component: "default"
  ports:
    - name: metrics
      port: 9402
      targetPort: 9402

